server:
  port: 8080

spring:
  # 加载项目根目录的 .env 文件（KEY=VALUE 格式，当 properties 读）
  # optional: 文件不存在也不报错；.env 已加入 .gitignore，不会被提交
  config:
    import: optional:file:./.env[.properties]
  application:
    name: ai-rag
  datasource:
    url: jdbc:postgresql://localhost:5432/rag
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

rag:
  upload-dir: E:/code/AI-RAG_training/uploads
  chunk-size: 700
  chunk-overlap: 120
  # 检索时默认取回多少个片段（后面用评测集调）
  top-k: 5
  # 相似度阈值：低于它认为"资料里没有"，用于拒答
  # 阈值扫描：0.1/0.3/0.5 在当前 150 题上指标一致，0.5 的 P95 更低；0.7 开始漏召回
  score-threshold: 0.5
  # 查询拆解：多意图问题拆成子问题分别召回（关闭可做 A/B 对比）
  query-decomposition-enabled: true
  # 混合检索：向量召回 + BM25 词法召回，再用 RRF 融合
  hybrid-enabled: true

ai:
  base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api-key: ${DASHSCOPE_API_KEY:}
  chat-model: qwen-plus
  embedding-model: text-embedding-v3
  embedding-dimension: 1024
  # 生成参数：温度越低越稳定，max-tokens 控制回答长度
  temperature: 0.2
  max-tokens: 800

management:
  endpoints:
    web:
      exposure:
        include: health,info

