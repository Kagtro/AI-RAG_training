<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>评测报告 · 知识库问答</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --ink: #0f172a;
            --muted: #64748b;
            --line: #e7ecf5;
            --brand: #4f46e5;
            --brand-2: #2563eb;
            --brand-soft: #eef2ff;
            --green: #15803d;
            --red: #b91c1c;
            --amber: #92400e;
            --radius: 16px;
            --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 10px 30px rgba(15, 23, 42, .06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background:
                radial-gradient(900px 500px at 8% -10%, #e0e7ff 0%, transparent 60%),
                radial-gradient(800px 500px at 100% 0%, #dbeafe 0%, transparent 55%),
                var(--bg);
            min-height: 100vh;
        }

        /* 顶栏 */
        header {
            height: 68px;
            padding: 0 28px;
            background: rgba(255, 255, 255, .82);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            box-shadow: 0 6px 16px rgba(79, 70, 229, .28);
        }

        .logo svg { width: 22px; height: 22px; }

        .brand-text h1 { font-size: 16px; margin: 0; }
        .brand-text p { margin: 3px 0 0; font-size: 12px; color: var(--muted); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 10px;
            color: var(--brand);
            background: var(--brand-soft);
            border: 1px solid #dfe4ff;
            text-decoration: none;
            font-size: 13px;
        }

        .back-link:hover { background: #e3e8ff; }
        .back-link svg { width: 15px; height: 15px; }

        .wrap { max-width: 1280px; margin: 0 auto; padding: 24px 24px 48px; }

        /* 标题行 */
        .page-head {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .page-head h2 { margin: 0; font-size: 22px; letter-spacing: -.2px; }
        .page-head p { margin: 6px 0 0; font-size: 13px; color: var(--muted); }

        .actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            height: 38px;
            padding: 0 14px;
            border: 0;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            cursor: pointer;
            color: var(--muted);
            background: #eef2f7;
            text-decoration: none;
            transition: background .15s, box-shadow .15s;
        }

        .btn:hover { background: #e2e8f0; color: var(--ink); }
        .btn:disabled { opacity: .55; cursor: not-allowed; }

        .btn.primary {
            color: #fff;
            background: linear-gradient(135deg, var(--brand), var(--brand-2));
            box-shadow: 0 8px 18px rgba(79, 70, 229, .24);
        }

        .btn.primary:hover { box-shadow: 0 10px 22px rgba(79, 70, 229, .3); }

        .btn.danger {
            color: var(--red);
            background: #fff1f0;
        }

        .btn.danger:hover { background: #fee2e2; }

        /* 指标卡 */
        .cards {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .metric {
            position: relative;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 14px;
            padding: 16px;
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .metric::after {
            content: "";
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: linear-gradient(180deg, var(--brand), var(--brand-2));
        }

        .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
        .metric .value { font-size: 27px; font-weight: 700; letter-spacing: -.5px; color: var(--ink); }
        .metric .value.good { color: var(--green); }
        .metric .value.warn { color: var(--amber); }
        .metric .hint { font-size: 11px; color: #94a3b8; margin-top: 6px; }

        /* 主面板 */
        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
            flex-wrap: wrap;
        }

        .panel-head h3 { margin: 0; font-size: 14px; }
        .panel-head .meta { font-size: 12px; color: var(--muted); }

        .filters { display: flex; gap: 8px; flex-wrap: wrap; }

        .chip {
            border: 1px solid var(--line);
            background: #fff;
            color: var(--muted);
            border-radius: 999px;
            padding: 5px 12px;
            font-size: 12px;
            cursor: pointer;
            transition: all .15s;
        }

        .chip:hover { border-color: #c7d2fe; color: var(--brand); }

        .chip.active {
            background: var(--brand);
            border-color: var(--brand);
            color: #fff;
        }

        .legend {
            padding: 10px 18px;
            font-size: 12px;
            color: var(--muted);
            background: #f8fafc;
            border-bottom: 1px solid var(--line);
            line-height: 1.8;
        }

        .legend b { color: #374151; }

        /* 表格 */
        .table-wrap { max-height: calc(100vh - 360px); overflow: auto; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }

        thead th {
            position: sticky;
            top: 0;
            z-index: 1;
            background: #f8fafc;
            color: var(--muted);
            font-weight: 600;
            text-align: left;
            padding: 11px 12px;
            border-bottom: 1px solid var(--line);
            white-space: nowrap;
        }

        tbody td {
            padding: 11px 12px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        tbody tr:hover td { background: #fafcff; }
        tbody tr:last-child td { border-bottom: 0; }

        .q { min-width: 280px; max-width: 420px; line-height: 1.6; }
        .num { color: var(--muted); white-space: nowrap; }

        .ok { color: var(--green); font-weight: 600; }
        .bad { color: var(--red); font-weight: 600; }
        .muted { color: #94a3b8; }

        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 500;
            white-space: nowrap;
        }

        .tag.answerable { background: #dcfce7; color: #166534; }
        .tag.cross_doc { background: #dbeafe; color: #1e40af; }
        .tag.unanswerable { background: #fef3c7; color: var(--amber); }

        details summary {
            cursor: pointer;
            color: var(--brand);
            font-size: 12px;
            list-style: none;
        }

        details summary::-webkit-details-marker { display: none; }
        details summary::before { content: "▸ "; }
        details[open] summary::before { content: "▾ "; }

        .answer-box {
            margin-top: 8px;
            padding: 10px 12px;
            background: #f8fafc;
            border-left: 3px solid #bfdbfe;
            border-radius: 0 8px 8px 0;
            color: #334155;
            font-size: 12.5px;
            line-height: 1.7;
            white-space: pre-wrap;
            max-width: 520px;
        }

        .empty {
            padding: 56px 24px;
            text-align: center;
            color: var(--muted);
            font-size: 13px;
        }

        .toast {
            position: fixed;
            right: 24px;
            bottom: 24px;
            max-width: 420px;
            padding: 11px 16px;
            border-radius: 10px;
            background: #0f172a;
            color: #fff;
            font-size: 13px;
            line-height: 1.5;
            box-shadow: 0 12px 30px rgba(15, 23, 42, .25);
            display: none;
            z-index: 10;
        }

        @media (max-width: 1100px) {
            .cards { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        }

        @media (max-width: 640px) {
            header { padding: 0 14px; height: 60px; }
            .brand-text p { display: none; }
            .wrap { padding: 16px 12px 32px; }
            .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .q { min-width: 180px; }
            .table-wrap { max-height: none; }
        }
    </style>
</head>
<body>
<header>
    <div class="brand">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z" stroke="currentColor" stroke-width="1.6"/>
                <path d="m4 7 8 4 8-4M12 11v10" stroke="currentColor" stroke-width="1.6"/>
            </svg>
        </div>
        <div class="brand-text">
            <h1>知识库问答</h1>
            <p>评测报告</p>
        </div>
    </div>
    <a class="back-link" href="/">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="m15 18-6-6 6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        返回问答
    </a>
</header>

<div class="wrap">
    <div class="page-head">
        <div>
            <h2>评测报告</h2>
            <p id="meta">加载中...</p>
        </div>
        <div class="actions">
            <button class="btn" id="refreshBtn">刷新</button>
            <a class="btn" href="/api/eval/report" download>下载 CSV</a>
            <button class="btn danger" id="runBtn" title="会调用 30 次模型，约 1 分钟">重新评测</button>
        </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="panel">
        <div class="panel-head">
            <div class="filters" id="filters">
                <button class="chip active" data-filter="all">全部</button>
                <button class="chip" data-filter="answerable">可答</button>
                <button class="chip" data-filter="cross_doc">跨文档</button>
                <button class="chip" data-filter="unanswerable">不可答</button>
                <button class="chip" data-filter="failed">只看失败</button>
            </div>
            <div class="meta" id="tableMeta"></div>
        </div>

        <div class="legend">
            <b>✓ 通过</b> · <b>✗ 未通过</b> · <b>— 不适用</b>　｜　
            <b>召回</b>：检索 topK 里有没有期望文档；
            <b>引用覆盖</b>：回答的引用里有没有期望文档；
            <b>正确</b>：答案是否命中关键词（粗筛，需人工复核）；
            <b>拒答</b>：不可答题有没有老实说"资料中没有相关信息"。
        </div>

        <div class="table-wrap">
            <div id="content"><div class="empty">加载中...</div></div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const state = { data: null, filter: 'all' };
    const $ = (s) => document.querySelector(s);

    function toast(message, ms = 4000) {
        const el = $('#toast');
        el.textContent = message;
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.display = 'none'; }, ms);
    }

    const pct = (v) => (Number(v) * 100).toFixed(1) + '%';

    function yesNo(v, yes = '✓', no = '✗') {
        if (v === null || v === undefined) return '<span class="muted">—</span>';
        return v ? `<span class="ok">${yes}</span>` : `<span class="bad">${no}</span>`;
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    async function loadLatest() {
        const meta = $('#meta');
        meta.textContent = '加载中...';
        try {
            const response = await fetch('/api/eval/latest');
            if (response.status === 404) {
                state.data = null;
                meta.textContent = '还没有评测报告';
                $('#cards').innerHTML = '';
                $('#content').innerHTML = '<div class="empty">还没有报告。点右上角"重新评测"跑一次（约 1 分钟，会调用模型）。</div>';
                return;
            }
            if (!response.ok) throw new Error('HTTP ' + response.status);
            state.data = await response.json();
            render();
        } catch (e) {
            meta.textContent = '加载失败：' + e.message;
            $('#content').innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
        }
    }

    function render() {
        const d = state.data;
        const time = d.generatedAt ? new Date(d.generatedAt).toLocaleString() : '未知';
        const params = d.topK ? `topK=${d.topK} · minScore=${d.minScore}` : '参数未记录（旧报告）';
        $('#meta').textContent = `最近一次评测：${time} · ${params} · 共 ${d.total} 题`;

        const cards = [
            { label: 'Recall@K', value: pct(d.recallAtK), hint: `${d.answerable} 道可答题`, cls: 'good' },
            { label: '跨文档召回', value: pct(d.crossRecallAtK), hint: `${d.crossDoc} 道跨文档题`, cls: d.crossRecallAtK >= 0.9 ? 'good' : 'warn' },
            { label: '引用覆盖率', value: pct(d.groundedness), hint: '答案引用是否覆盖期望文档', cls: d.groundedness >= 0.8 ? 'good' : 'warn' },
            { label: '答案正确率', value: pct(d.answerAccuracy), hint: '关键词粗筛，需人工抽检', cls: d.answerAccuracy >= 0.9 ? 'good' : 'warn' },
            { label: '拒答准确率', value: pct(d.refusalAccuracy), hint: `${d.unanswerable} 道不可答题`, cls: d.refusalAccuracy >= 0.9 ? 'good' : 'warn' },
            { label: 'P95 延迟', value: (d.p95LatencyMs / 1000).toFixed(1) + 's', hint: '平均 ' + (d.avgLatencyMs / 1000).toFixed(1) + 's' },
        ];

        $('#cards').innerHTML = cards.map(card => `
            <div class="metric">
                <div class="label">${card.label}</div>
                <div class="value ${card.cls || ''}">${card.value}</div>
                <div class="hint">${card.hint}</div>
            </div>`).join('');

        renderTable();
    }

    function filteredCases() {
        const cases = state.data ? state.data.cases : [];
        if (state.filter === 'all') return cases;
        if (state.filter === 'failed') {
            return cases.filter(c => c.category !== 'unanswerable' && (!c.recallHit || !c.grounded || !c.correct))
                .concat(cases.filter(c => c.category === 'unanswerable' && !c.refused));
        }
        return cases.filter(c => c.category === state.filter);
    }

    function renderTable() {
        const cases = filteredCases();
        if (!cases.length) {
            $('#content').innerHTML = '<div class="empty">没有符合条件的题目。</div>';
            $('#tableMeta').textContent = '';
            return;
        }
        $('#tableMeta').textContent = `显示 ${cases.length} / ${state.data.total} 题`;

        const rows = cases.map(c => {
            const isUn = c.category === 'unanswerable';
            const dash = '<span class="muted">—</span>';
            const category = { answerable: '可答', cross_doc: '跨文档', unanswerable: '不可答' }[c.category] || c.category;
            return `<tr>
                <td class="num">${c.id}</td>
                <td><span class="tag ${c.category}">${category}</span></td>
                <td class="q">${escapeHtml(c.question)}</td>
                <td>${isUn ? dash : yesNo(c.recallHit)}</td>
                <td>${isUn ? dash : yesNo(c.grounded)}</td>
                <td>${isUn ? dash : yesNo(c.correct)}</td>
                <td>${isUn ? yesNo(c.refused) : dash}</td>
                <td class="num">${c.totalMs} ms</td>
                <td>
                    <details>
                        <summary>查看</summary>
                        <div class="answer-box">${escapeHtml(c.answer) || '（空）'}</div>
                    </details>
                </td>
            </tr>`;
        }).join('');

        $('#content').innerHTML = `<table>
            <thead><tr>
                <th>#</th><th>类型</th><th>问题</th><th>召回</th><th>引用覆盖</th>
                <th>正确</th><th>拒答</th><th>延迟</th><th>答案</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    async function runEval() {
        const ok = confirm('重新评测会调用 30 次模型，约 1 分钟、约 0.1 元。确定继续吗？');
        if (!ok) return;
        const btn = $('#runBtn');
        btn.disabled = true;
        btn.textContent = '评测中...';
        try {
            const response = await fetch('/api/eval/run?topK=8&minScore=0.1', { method: 'POST' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            toast('评测完成，正在刷新...');
            await loadLatest();
        } catch (e) {
            toast('评测失败：' + e.message, 6000);
        } finally {
            btn.disabled = false;
            btn.textContent = '重新评测';
        }
    }

    $('#refreshBtn').addEventListener('click', loadLatest);
    $('#runBtn').addEventListener('click', runEval);

    $('#filters').addEventListener('click', (event) => {
        const chip = event.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.filter = chip.dataset.filter;
        if (state.data) renderTable();
    });

    loadLatest();
</script>
</body>
</html>
