<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG 评测报告</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }
        header {
            height: 56px;
            padding: 0 24px;
            background: #1f4e79;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header .title { font-weight: 600; }
        header a { color: #cfe4f7; text-decoration: none; font-size: 13px; }
        header a:hover { text-decoration: underline; }
        .wrap { max-width: 1280px; margin: 20px auto; padding: 0 20px 40px; }
        .toolbar {
            display: flex; flex-wrap: wrap; gap: 10px;
            align-items: center; justify-content: space-between;
            margin-bottom: 16px;
        }
        .meta { font-size: 13px; color: #6b7280; }
        .meta b { color: #374151; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .btn {
            border: 0; border-radius: 8px; padding: 8px 14px;
            font-size: 13px; cursor: pointer; background: #eef2f7; color: #374151;
        }
        .btn:hover { background: #e2e8f0; }
        .btn.primary { background: #2e74b5; color: #fff; }
        .btn.primary:hover { background: #1f5f9c; }
        .btn:disabled { opacity: .55; cursor: not-allowed; }
        .btn.danger { background: #fff1f0; color: #b91c1c; }
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }
        .card {
            background: #fff; border-radius: 12px; padding: 14px 16px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
        }
        .card .label { font-size: 12px; color: #6b7280; margin-bottom: 8px; }
        .card .value { font-size: 24px; font-weight: 700; color: #1f4e79; }
        .card .hint { font-size: 11px; color: #9ca3af; margin-top: 5px; }
        .panel {
            background: #fff; border-radius: 12px;
            box-shadow: 0 1px 3px rgba(15, 23, 42, .08);
            overflow: hidden;
        }
        .filters { padding: 12px 16px; border-bottom: 1px solid #eef2f7; display: flex; gap: 8px; flex-wrap: wrap; }
        .legend {
            padding: 10px 16px;
            font-size: 12px;
            color: #6b7280;
            background: #f8fafc;
            border-bottom: 1px solid #eef2f7;
            line-height: 1.8;
        }
        .legend b { color: #374151; }
        .chip {
            border: 1px solid #d1d5db; border-radius: 999px;
            padding: 4px 12px; font-size: 12px; background: #fff; cursor: pointer;
        }
        .chip.active { background: #2e74b5; border-color: #2e74b5; color: #fff; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid #eef2f7; vertical-align: top; }
        th { background: #f8fafc; color: #6b7280; font-weight: 600; white-space: nowrap; }
        tr:hover td { background: #fafcff; }
        .q { min-width: 260px; max-width: 380px; }
        .ok { color: #15803d; font-weight: 600; }
        .bad { color: #b91c1c; font-weight: 600; }
        .muted { color: #9ca3af; }
        .tag {
            display: inline-block; padding: 1px 7px; border-radius: 999px;
            font-size: 11px; background: #eef2f7; color: #475569;
        }
        .tag.answerable { background: #dcfce7; color: #166534; }
        .tag.cross_doc { background: #dbeafe; color: #1e40af; }
        .tag.unanswerable { background: #fef3c7; color: #92400e; }
        details summary { cursor: pointer; color: #2e74b5; font-size: 12px; }
        details div {
            margin-top: 6px; padding: 8px 10px; background: #f8fafc;
            border-left: 3px solid #bfdbfe; white-space: pre-wrap;
            color: #374151; line-height: 1.6; max-width: 520px;
        }
        .empty { padding: 40px; text-align: center; color: #6b7280; }
        .toast {
            position: fixed; right: 24px; bottom: 24px; background: #1f2937; color: #fff;
            padding: 10px 16px; border-radius: 8px; font-size: 13px; display: none;
            max-width: 420px; line-height: 1.5;
        }
        @media (max-width: 900px) {
            .q { min-width: 180px; }
            th, td { padding: 8px; }
        }
    </style>
</head>
<body>
<header>
    <div class="title">RAG 评测报告</div>
    <a href="/">← 返回聊天页</a>
</header>

<div class="wrap">
    <div class="toolbar">
        <div class="meta" id="meta">加载中...</div>
        <div class="actions">
            <button class="btn" id="refreshBtn">刷新</button>
            <a class="btn" href="/api/eval/report" download>下载 CSV</a>
            <button class="btn danger" id="runBtn" title="会调用 30 次模型，约 1 分钟">重新评测</button>
        </div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="panel">
        <div class="filters" id="filters">
            <button class="chip active" data-filter="all">全部</button>
            <button class="chip" data-filter="answerable">可答</button>
            <button class="chip" data-filter="cross_doc">跨文档</button>
            <button class="chip" data-filter="unanswerable">不可答</button>
            <button class="chip" data-filter="failed">只看失败</button>
        </div>
        <div class="legend">
            <b>✓ 通过</b> · <b>✗ 未通过</b> · <b>— 不适用</b>　｜　
            <b>召回</b>：检索 topK 里有没有期望文档；
            <b>引用覆盖</b>：回答的引用里有没有期望文档；
            <b>正确</b>：答案是否命中关键词（粗筛，需人工复核）；
            <b>拒答</b>：不可答题有没有老实说“资料中没有相关信息”。
        </div>
        <div id="content"><div class="empty">加载中...</div></div>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    const state = { data: null, filter: 'all' };

    const $ = (s) => document.querySelector(s);

    function toast(message, ms = 4000) {
        const el = $('#toast');
        el.textContent = message;
        el.style.display = 'block';
        clearTimeout(el._timer);
        el._timer = setTimeout(() => { el.style.display = 'none'; }, ms);
    }

    function pct(v) {
        return (Number(v) * 100).toFixed(1) + '%';
    }

    function yesNo(v, yes = '✓', no = '✗') {
        if (v === null || v === undefined) return '<span class="muted">—</span>';
        return v ? `<span class="ok">${yes}</span>` : `<span class="bad">${no}</span>`;
    }

    async function loadLatest() {
        const meta = $('#meta');
        meta.textContent = '加载中...';
        try {
            const response = await fetch('/api/eval/latest');
            if (response.status === 404) {
                state.data = null;
                meta.textContent = '还没有评测报告';
                $('#cards').innerHTML = '';
                $('#content').innerHTML = '<div class="empty">还没有报告。点右上角“重新评测”跑一次（约 1 分钟，会调用模型）。</div>';
                return;
            }
            if (!response.ok) throw new Error('HTTP ' + response.status);
            state.data = await response.json();
            render();
        } catch (e) {
            meta.textContent = '加载失败：' + e.message;
            $('#content').innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
        }
    }

    function render() {
        const d = state.data;
        const time = d.generatedAt ? new Date(d.generatedAt).toLocaleString() : '未知';
        const params = d.topK ? `topK=${d.topK}, minScore=${d.minScore}` : '参数未记录（旧报告）';
        $('#meta').innerHTML = `最近一次评测：<b>${time}</b> · ${params} · 共 ${d.total} 题`;

        const cards = [
            ['Recall@K', pct(d.recallAtK), `${d.answerable} 道可答题`],
            ['跨文档召回', pct(d.crossRecallAtK), `${d.crossDoc} 道跨文档题`],
            ['引用覆盖率', pct(d.groundedness), '答案引用是否覆盖期望文档'],
            ['答案正确率', pct(d.answerAccuracy), '关键词粗筛，需人工抽检'],
            ['拒答准确率', pct(d.refusalAccuracy), `${d.unanswerable} 道不可答题`],
            ['P95 延迟', (d.p95LatencyMs / 1000).toFixed(1) + 's', '平均 ' + (d.avgLatencyMs / 1000).toFixed(1) + 's'],
        ];
        $('#cards').innerHTML = cards.map(([label, value, hint]) => `
            <div class="card">
                <div class="label">${label}</div>
                <div class="value">${value}</div>
                <div class="hint">${hint}</div>
            </div>`).join('');

        renderTable();
    }

    function filteredCases() {
        const cases = state.data ? state.data.cases : [];
        if (state.filter === 'all') return cases;
        if (state.filter === 'failed') {
            return cases.filter(c => c.category !== 'unanswerable' && (!c.recallHit || !c.grounded || !c.correct))
                .concat(cases.filter(c => c.category === 'unanswerable' && !c.refused));
        }
        return cases.filter(c => c.category === state.filter);
    }

    function renderTable() {
        const cases = filteredCases();
        if (!cases.length) {
            $('#content').innerHTML = '<div class="empty">没有符合条件的题目。</div>';
            return;
        }
        const rows = cases.map(c => {
            const answer = (c.answer || '').replace(/</g, '&lt;');
            const category = { answerable: '可答', cross_doc: '跨文档', unanswerable: '不可答' }[c.category] || c.category;
            const isUn = c.category === 'unanswerable';
            const dash = '<span class="muted">—</span>';
            return `<tr>
                <td>${c.id}</td>
                <td><span class="tag ${c.category}">${category}</span></td>
                <td class="q">${escapeHtml(c.question)}</td>
                <td>${isUn ? dash : yesNo(c.recallHit)}</td>
                <td>${isUn ? dash : yesNo(c.grounded)}</td>
                <td>${isUn ? dash : yesNo(c.correct)}</td>
                <td>${isUn ? yesNo(c.refused) : dash}</td>
                <td>${c.totalMs} ms</td>
                <td><details><summary>查看</summary><div>${answer || '（空）'}</div></details></td>
            </tr>`;
        }).join('');
        $('#content').innerHTML = `<table>
            <thead><tr>
                <th>#</th><th>类型</th><th>问题</th><th>召回</th><th>引用覆盖</th>
                <th>正确</th><th>拒答</th><th>延迟</th><th>答案</th>
            </tr></thead>
            <tbody>${rows}</tbody>
        </table>`;
    }

    function escapeHtml(s) {
        return String(s || '').replace(/[&<>"']/g, m => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        }[m]));
    }

    async function runEval() {
        const ok = confirm('重新评测会调用 30 次模型，约 1 分钟、约 0.1 元。确定继续吗？');
        if (!ok) return;
        const btn = $('#runBtn');
        btn.disabled = true;
        btn.textContent = '评测中...';
        try {
            // 注意：这里的 topK/minScore 可改成页面输入；默认 8 / 0.1
            const response = await fetch('/api/eval/run?topK=8&minScore=0.1', { method: 'POST' });
            if (!response.ok) throw new Error('HTTP ' + response.status);
            toast('评测完成，正在刷新...');
            await loadLatest();
        } catch (e) {
            toast('评测失败：' + e.message, 6000);
        } finally {
            btn.disabled = false;
            btn.textContent = '重新评测';
        }
    }

    $('#refreshBtn').addEventListener('click', loadLatest);
    $('#runBtn').addEventListener('click', runEval);

    $('#filters').addEventListener('click', (event) => {
        const chip = event.target.closest('.chip');
        if (!chip) return;
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        state.filter = chip.dataset.filter;
        if (state.data) renderTable();
    });

    loadLatest();
</script>
</body>
</html>
