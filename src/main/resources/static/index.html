<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>知识库问答 · RAG</title>
    <link rel="stylesheet" href="/css/app.css?v=20261103b">
</head>
<body>
<header class="topbar">
    <div class="brand">
        <div class="logo">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 3 4 7v10l8 4 8-4V7l-8-4Z" stroke="currentColor" stroke-width="1.6"/>
                <path d="m4 7 8 4 8-4M12 11v10" stroke="currentColor" stroke-width="1.6"/>
            </svg>
        </div>
        <div class="brand-text">
            <h1>知识库问答</h1>
            <p>上传文档，基于内容回答并标注来源</p>
        </div>
    </div>

    <div class="topbar-right">
        <div class="health-pill">
            <span class="dot"></span>
            <span id="health">连接中...</span>
        </div>
        <a class="eval-link" href="/eval.html">
            评测报告
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m9 18 6-6-6-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
    </div>
</header>

<main class="layout">
    <!-- 左侧：知识库与文档 -->
    <aside class="sidebar">
        <section class="panel upload-panel">
            <div class="panel-head">
                <h2>知识库</h2>
                <span class="kb-badge">KB</span>
            </div>

            <label class="field">
                <span>知识库 ID</span>
                <input id="kbId" type="number" value="1" min="1">
            </label>

            <label class="dropzone" for="fileInput">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 16V4m0 0L8 8m4-4 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
                </svg>
                <strong id="dropzoneTitle">选择文件</strong>
                <span>支持多选 · PDF / Word / Markdown / TXT</span>
                <input id="fileInput" type="file" multiple accept=".pdf,.docx,.doc,.md,.txt">
            </label>

            <div class="selected-files" id="selectedFiles" hidden>
                <div class="selected-head">
                    <span>已选 <b id="selectedCount">0</b> 个文件</span>
                    <button type="button" class="link-btn" id="clearFiles">清空</button>
                </div>
                <div class="selected-list" id="selectedList"></div>
            </div>

            <button id="uploadBtn" class="btn primary full">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M12 19V5m0 0L6 11m6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="uploadBtnText">上传并索引</span>
            </button>
            <p class="hint" id="uploadHint">上传后自动解析、切片、向量化，完成即可提问。</p>
        </section>

        <section class="panel docs-panel">
            <div class="panel-head">
                <h2>文档</h2>
                <button id="refreshBtn" class="btn ghost small">刷新</button>
            </div>
            <div id="docs" class="docs">加载中...</div>
        </section>
    </aside>

    <!-- 右侧：聊天 -->
    <section class="chat">
        <div class="chat-head">
            <div>
                <h2>智能问答</h2>
                <p>回答仅基于已索引文档，并附带引用来源</p>
            </div>
            <span class="online-pill"><span class="dot"></span> 在线</span>
        </div>

        <div id="messages" class="messages">
            <div class="empty-tip">
                <div class="empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M12 3c.6 3.8 2.2 5.4 6 6-3.8.6-5.4 2.2-6 6-.6-3.8-2.2-5.4-6-6 3.8-.6 5.4-2.2 6-6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <path d="M19 14c.3 1.7 1 2.4 2.7 2.7-1.7.3-2.4 1-2.7 2.7-.3-1.7-1-2.4-2.7-2.7 1.7-.3 2.4-1 2.7-2.7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3>开始提问</h3>
                <p>先上传文档，再问和文档相关的问题；回答会流式输出并标注引用。</p>
                <div class="suggestions">
                    <button class="suggest" data-q="员工出差住宿标准是多少？">员工出差住宿标准是多少？</button>
                    <button class="suggest" data-q="职工累计工作满10年不满20年，年休假多少天？">年休假有多少天？</button>
                    <button class="suggest" data-q="单位应当在事故伤害发生之日起多少日内提出工伤认定申请？">工伤认定申请时限？</button>
                </div>
            </div>
        </div>

        <form id="chatForm" class="composer">
            <div class="composer-box">
                <textarea id="question" rows="1" placeholder="输入问题，Enter 发送，Shift + Enter 换行"></textarea>
                <button id="sendBtn" class="send-btn" type="submit" title="发送">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M4 12 20 4l-4 16-4-6-8-2Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                    </svg>
                </button>
            </div>
            <p class="composer-tip">AI 回答可能存在误差，请以引用原文为准</p>
        </form>
    </section>
</main>

<script src="/js/app.js?v=20261103b"></script>
<script>
    // 点击示例问题，自动填入输入框
    document.querySelectorAll('.suggest').forEach((button) => {
        button.addEventListener('click', () => {
            const input = document.querySelector('#question');
            input.value = button.dataset.q || '';
            input.focus();
        });
    });
</script>
</body>
</html>
